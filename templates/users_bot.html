{% extends "main_bot.html" %}

{% block tab %}
<a href="?op=add_user" class="btn btn-primary" title="{{ _('Add')}}">{{ _('Add')}}</a>
<a href="?op=update_users" class="btn btn-secondary" title="{{ _('Update')}}">{{ _('Get users info')}}</a>
<table class="table">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">{{ _('Name')}}</th>
        <th scope="col">{{ _('User')}}</th>
        <th scope="col">{{ _('Say')}}</th>
        <th scope="col">{{ _('Command')}}</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <th scope="row">
            <img src='/TelegramBot/avatars/{{user.user_id}}.jpg' height='30px' onError="this.src='/TelegramBot/static/TelegramBot.png'">
            {{user.user_id}}
        </th>
        <td>{{user.name}}</td>
        <td>{{user.user}}</td>
        <td>{{user.say}}</td>
        <td>
          {%if user.command%}
          <span class="far fa-check-circle text-success panel_icon"></span>
          {%else%}
          <span class="far fa-times-circle text-danger panel_icon"></span>
          {%endif%}
        </td>
        <td>
            <a type="button" class="btn btn-success btn-sm" href="?user={{user.id}}&op=edit" title="{{ _('Edit')}}"><i class="feather icon-edit"></i></a>
            <a type="button" class="btn btn-danger btn-sm" href="?user={{user.id}}&op=delete" title="{{ _('Delete')}}" onClick="return confirm('Delete user {{user.name}}?')" ><i class="feather icon-trash"></i></a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
</table>
{% endblock %}
